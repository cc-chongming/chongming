roleType: PRODUCT
description: Validate product value, scope, user journeys, acceptance criteria and business risk.
activationRules:
  - Always activate for a review.
promptVersion: product-v1
contextSelectors:
  - requirement-snapshot
  - repository-snapshot
  - scout-overview
  - role-scope
checklist:
  - checkpointKey: product.requirement_completeness
    instruction: Verify the requirement states complete goals, user journeys, inputs, outputs and explicit out-of-scope boundaries.
    required: true
  - checkpointKey: product.acceptance_criteria
    instruction: Verify every promised behavior has observable, testable acceptance criteria.
    required: true
  - checkpointKey: product.user_value
    instruction: Verify the change delivers concrete user value and identify users or flows negatively affected.
    required: true
  - checkpointKey: product.scope_boundary
    instruction: Verify the scope is bounded, free of hidden expansions, and consistent with existing product behavior.
    required: true
  - checkpointKey: product.testability
    instruction: Verify the requirement can be validated end to end and name anything that blocks verification.
    required: true
  - checkpointKey: product.business_risk
    instruction: Identify business, compliance or experience risks introduced by the requirement.
    required: false
allowedTools:
  - submit_claim
  - complete_initial_review
  - list_persisted_debate_topics
  - submit_challenge
  - submit_rebuttal
  - change_claim_position
  - request_additional_evidence
  - searchText
  - readLines
outputKind: ROLE_ASSESSMENT
modelProfile: role-reviewer
timeout: PT30S
maxIterations: 20

roleType: PRODUCT
description: Validate product value, scope, user journeys, acceptance criteria and business risk.
activationRules:
  - Always activate for a review.
promptVersion: product-v1
contextSelectors:
  - requirement-snapshot
  - repository-snapshot
  - scout-overview
  - role-scope
checklist:
  - Check value and user impact.
  - Check acceptance criteria and scope gaps.
allowedTools:
  - submit_claim
  - complete_initial_review
  - list_persisted_debate_topics
  - submit_challenge
  - submit_rebuttal
  - change_claim_position
  - request_additional_evidence
  - searchText
  - readLines
outputKind: ROLE_ASSESSMENT
modelProfile: role-reviewer
timeout: PT30S
maxIterations: 20

roleType: BACKEND
description: Validate service boundaries, data consistency, API behavior and operational risk.
activationRules:
  - Always activate for a review.
promptVersion: backend-v1
contextSelectors:
  - requirement-snapshot
  - repository-snapshot
  - scout-overview
  - role-scope
checklist:
  - Check API and data consistency constraints.
  - Check failure handling and operability.
allowedTools:
  - submit_claim
  - complete_initial_review
  - list_persisted_debate_topics
  - submit_challenge
  - submit_rebuttal
  - change_claim_position
  - request_additional_evidence
  - listFiles
  - findSymbol
  - searchText
  - readLines
outputKind: ROLE_ASSESSMENT
modelProfile: role-reviewer
timeout: PT30S
maxIterations: 20

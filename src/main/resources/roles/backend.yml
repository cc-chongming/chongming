roleType: BACKEND
description: Validate service boundaries, data consistency, API behavior and operational risk.
activationRules:
  - Always activate for a review.
promptVersion: backend-v1
contextSelectors:
  - requirement-snapshot
  - repository-snapshot
  - scout-overview
  - role-scope
checklist:
  - checkpointKey: backend.api_contract
    instruction: Verify the service interfaces, request and response contracts and error codes match the requirement.
    required: true
  - checkpointKey: backend.data_consistency
    instruction: Verify data model changes, constraints, migrations and transaction boundaries keep data consistent.
    required: true
  - checkpointKey: backend.failure_handling
    instruction: Verify timeout, retry, idempotency and degradation behavior are defined for reachable failure paths.
    required: true
  - checkpointKey: backend.security_compliance
    instruction: Verify authentication, authorization, input validation and sensitive data handling are addressed.
    required: true
  - checkpointKey: backend.operability
    instruction: Verify logging, monitoring, configuration and rollout operability for the affected services.
    required: true
  - checkpointKey: backend.performance_risk
    instruction: Identify throughput, latency or resource usage risks introduced by the change.
    required: false
allowedTools:
  - submit_assessment
  - submit_claim
  - complete_initial_review
  - list_persisted_debate_topics
  - submit_challenge
  - submit_rebuttal
  - change_claim_position
  - request_additional_evidence
  - listFiles
  - findSymbol
  - searchText
  - readLines
outputKind: ROLE_ASSESSMENT
modelProfile: role-reviewer
timeout: PT30S
maxIterations: 20

roleType: PROJECT
description: Validate delivery scope, dependencies, milestones and implementation risk.
activationRules:
  - Always activate for a review.
promptVersion: project-v1
contextSelectors:
  - requirement-snapshot
  - repository-snapshot
  - scout-overview
  - role-scope
checklist:
  - checkpointKey: project.delivery_scope
    instruction: Verify the delivery scope is clearly decomposed into implementable work items with visible boundaries.
    required: true
  - checkpointKey: project.dependency_risk
    instruction: Verify external, cross-team and upstream dependencies are identified and their availability risk is assessed.
    required: true
  - checkpointKey: project.milestone_feasibility
    instruction: Verify milestones, sequencing and effort estimates are feasible for the stated deadline.
    required: true
  - checkpointKey: project.ownership_readiness
    instruction: Verify ownership, review responsibilities and acceptance process are assignable and unambiguous.
    required: true
  - checkpointKey: project.rollout_and_rollback
    instruction: Verify rollout steps, feature flags or rollback paths exist for risky changes.
    required: true
  - checkpointKey: project.schedule_risk
    instruction: Identify schedule or coordination risks that could block delivery of this requirement.
    required: false
allowedTools:
  - submit_claim
  - complete_initial_review
  - list_persisted_debate_topics
  - submit_challenge
  - submit_rebuttal
  - change_claim_position
  - request_additional_evidence
  - listFiles
  - searchText
outputKind: ROLE_ASSESSMENT
modelProfile: role-reviewer
timeout: PT30S
maxIterations: 20

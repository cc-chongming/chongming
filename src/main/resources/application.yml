spring:
  profiles:
    active: local
  application:
    name: chongming
  flyway:
    enabled: false
  servlet:
    multipart:
      # [AIREVIEW-PLAN-031] Task delivery attachments advertise a 20MB ceiling; raise Spring's
      # 1MB/10MB defaults so the business rule in DevTaskAttachmentService is the real gate.
      max-file-size: ${REVIEW_ATTACHMENT_MAX_FILE_SIZE:20MB}
      max-request-size: ${REVIEW_ATTACHMENT_MAX_REQUEST_SIZE:25MB}
  lifecycle:
    # [AIREVIEW-PLAN-069#3] Graceful shutdown is bounded per phase: even a leaked long-lived
    # connection can only delay close by 10s instead of the Boot default 30s.
    timeout-per-shutdown-phase: 10s
  mail:
    # QQ 邮箱 SMTP（SSL 465）；password 必须使用 QQ 邮箱授权码，通过环境变量注入，不入库不入仓。
    host: ${REVIEW_QQ_MAIL_HOST:smtp.qq.com}
    port: ${REVIEW_QQ_MAIL_PORT:465}
    username: ${REVIEW_QQ_MAIL_SENDER:}
    password: ${REVIEW_QQ_MAIL_AUTH_CODE:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 30000
          writetimeout: 30000

management:
  health:
    # [AIREVIEW-PLAN-069#3] MailHealthIndicator opens a real SMTP connection on every health probe
    # (local profile observed >8s hang); disable it so health checks never add shutdown latency.
    mail:
      enabled: false

review:
  workspace-root: ${REVIEW_WORKSPACE_ROOT:.agentscope/workspace}
  max-agents: 8
  max-debate-rounds: 2
  gate:
    # A verified P1 opposing Claim is never silently passed; deployments may select another non-final AI result.
    p1-oppose-result: ${REVIEW_GATE_P1_OPPOSE_RESULT:CONDITIONAL}
  orchestration:
    # Bounds director stage-plan rewrites; deployment may override this environment placeholder.
    max-plan-revisions: ${REVIEW_MAX_PLAN_REVISIONS:3}
    # Bounds concurrent role rounds when first-round reviews are dispatched in parallel (PLAN-020#0.5.1).
    parallel-role-rounds: ${REVIEW_PARALLEL_ROLE_ROUNDS:4}
  diagnostics:
    # Only enables a redacted startup-failure summary in server logs; keep disabled outside a controlled local debugging session.
    log-startup-failure-stack: false
    # The standalone Scout preview may invoke a configured model and expose review-scoped trace data.
    # Enable only in a controlled local diagnostic profile.
    context-scout-preview-enabled: false
  repositories:
    # `cx-ai` is looked up beside this project by default; deployments with a different layout set
    # CX_AI_REPOSITORY_ROOT locally. API callers can still supply only the opaque repository ID.
    # [AIREVIEW-PLAN-028] Remote entries are cloned into server-managed mirrors before snapshotting.
    # Hosts resolving to private address ranges are rejected unless allow-internal is enabled.
    allow-internal: ${REVIEW_REPOSITORIES_ALLOW_INTERNAL:false}
    allowed:
      - id: cx-ai
        root: ${CX_AI_REPOSITORY_ROOT:../cx-ai}
      # Remote repository example (enable by providing a real URL via the environment):
      # - id: sample-remote
      #   type: remote
      #   display-name: 示例远程仓库
      #   remote:
      #     url: ${SAMPLE_REMOTE_REPOSITORY_URL:}
      #     ref: main
      #     clone-timeout: PT10M
      #     auth:
      #       type: https-token
      #       token-env: SAMPLE_REMOTE_REPOSITORY_TOKEN
  remote-token:
    # [AIREVIEW-PLAN-029] AES key protecting requirement-supplied remote repository tokens; only
    # injected through the environment. Without it, online repositories with tokens are rejected.
    key: ${REVIEW_REMOTE_TOKEN_KEY:}
  agentscope:
    persist-session: true
    state-home: ${AGENTSCOPE_STATE_HOME:.agentscope/state}
    # Director needs enough turns to inspect the requirement, produce a plan, and dispatch roles.
    # Keep this bounded to prevent a malformed tool loop from keeping a review running forever.
    director-max-iterations: ${REVIEW_AGENTSCOPE_DIRECTOR_MAX_ITERATIONS:48}
    # Context Scout is advisory. Exhausting either limit records a degradation and immediately starts Director.
    scout-max-iterations: ${REVIEW_AGENTSCOPE_SCOUT_MAX_ITERATIONS:12}
    scout-max-tool-calls: ${REVIEW_AGENTSCOPE_SCOUT_MAX_TOOL_CALLS:20}
    scout-timeout: ${REVIEW_AGENTSCOPE_SCOUT_TIMEOUT:PT150S}
    # Debate convergence fallback: force-escalate open topics and begin judging when the Director
    # wakes too often or the debate exceeds the wall-clock budget.
    debate-max-director-wakes: ${REVIEW_AGENTSCOPE_DEBATE_MAX_DIRECTOR_WAKES:24}
    # [AIREVIEW-PLAN-060#2,#4] Stage liveness heartbeat: re-wake an idle staged review after the
    # idle window, then deterministically close it once the server-side re-wake budget is exhausted.
    liveness-scan-interval: ${REVIEW_AGENTSCOPE_LIVENESS_SCAN_INTERVAL:PT60S}
    liveness-rewake-idle: ${REVIEW_AGENTSCOPE_LIVENESS_REWAKE_IDLE:PT90S}
    liveness-max-rewakes: ${REVIEW_AGENTSCOPE_LIVENESS_MAX_REWAKES:3}
    debate-convergence-timeout: ${REVIEW_AGENTSCOPE_DEBATE_CONVERGENCE_TIMEOUT:PT20M}
  model-gateway:
    enabled: ${REVIEW_MODEL_GATEWAY_ENABLED:false}
    base-url: ${REVIEW_MODEL_GATEWAY_BASE_URL:}
    model-name: ${REVIEW_MODEL_GATEWAY_MODEL_NAME:}
    # Provider tokens that reject simultaneous requests need this set to 1 (see local profile).
    max-concurrent-calls: ${REVIEW_MODEL_GATEWAY_MAX_CONCURRENT_CALLS:4}
    # Supply the key only through an ignored profile-specific configuration file.
    api-key:
    # Print request/response bodies only for a controlled local debugging session; never enable in shared environments.
    log-conversation: false
    # Logical profiles are safe deployment placeholders; replace model IDs and endpoint variables when enabling calls.
    profiles:
      director:
        provider: openai-compatible
        model-name: ${review.model-gateway.model-name:chongming-director-placeholder}
        temperature: 0.2
        timeout: PT300S
        max-tokens: 65536
        retry:
          max-retries: 2
          initial-backoff: PT0.2S
        fallback-profile: fallback
      scout:
        provider: openai-compatible
        model-name: ${review.model-gateway.model-name:chongming-scout-placeholder}
        temperature: 0.0
        # Repository exploration can be slow on a local model; switch once to the configured fallback after timeout.
        timeout: PT120S
        max-tokens: 65536
        retry:
          max-retries: 0
          initial-backoff: PT0.2S
        fallback-profile: fallback
      role-reviewer:
        provider: openai-compatible
        model-name: ${review.model-gateway.model-name:chongming-reviewer-placeholder}
        temperature: 0.2
        timeout: PT30S
        max-tokens: 65536
        retry:
          # [AIREVIEW-PLAN-024#6] A single retry caps the worst-case wait at ~60s instead of ~90s
          # for one role; repeated failures are then short-circuited by the attempt-scoped breaker.
          max-retries: 1
          initial-backoff: PT0.2S
        fallback-profile: fallback
      judge:
        provider: openai-compatible
        model-name: ${review.model-gateway.model-name:chongming-judge-placeholder}
        temperature: 0.0
        timeout: PT30S
        max-tokens: 65536
        retry:
          max-retries: 2
          initial-backoff: PT0.2S
        fallback-profile: fallback
      fallback:
        provider: openai-compatible
        # Override this profile in application-local.yml with a real alternate model when one is available.
        model-name: ${review.model-gateway.model-name:chongming-fallback-placeholder}
        temperature: 0.0
        timeout: PT120S
        max-tokens: 65536
        retry:
          max-retries: 0
          initial-backoff: PT0.2S
    # [AIREVIEW-PLAN-024#6] Attempt-scoped circuit breaker keyed by provider/model/profile. After
    # failure-threshold consecutive transient failures, later same-profile calls in the same review
    # attempt route straight to the configured fallback; every probe-interval routed calls one
    # half-open probe is sent to the primary so a recovered provider can close the breaker. The
    # breaker never persists across reviews or attempts. Set failure-threshold to 0 to disable.
    circuit-breaker:
      failure-threshold: ${REVIEW_MODEL_CIRCUIT_BREAKER_FAILURE_THRESHOLD:2}
      probe-interval: ${REVIEW_MODEL_CIRCUIT_BREAKER_PROBE_INTERVAL:3}
  persistence:
    # Disabled by default. Override these placeholders in the deployment environment.
    enabled: ${REVIEW_PERSISTENCE_ENABLED:true}
    jdbc-url: ${REVIEW_DB_URL:jdbc:mysql://127.0.0.1:3306/chongming_placeholder?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${REVIEW_DB_USERNAME:chongming_placeholder}
    password: ${REVIEW_DB_PASSWORD:}
    maximum-pool-size: ${REVIEW_DB_MAXIMUM_POOL_SIZE:8}
    agentscope:
      database-name: ${REVIEW_AGENTSCOPE_DATABASE:chongming_placeholder}
      state-table-name: ${REVIEW_AGENTSCOPE_STATE_TABLE:chongming_agentscope_state}
      workspace-table-name: ${REVIEW_AGENTSCOPE_WORKSPACE_TABLE:chongming_agentscope_workspace}
      snapshot-table-name: ${REVIEW_AGENTSCOPE_SNAPSHOT_TABLE:chongming_agentscope_snapshot}
      lock-key-prefix: ${REVIEW_AGENTSCOPE_LOCK_KEY_PREFIX:chongming:agentscope:lock:}
      initialize-schema: ${REVIEW_AGENTSCOPE_INITIALIZE_SCHEMA:false}
  runtime-trace:
    # [AIREVIEW-PLAN-022] Durable AG-UI runtime trace for restart replay. Writes are best-effort:
    # a failure is logged and never blocks the review run or the real-time SSE stream.
    persistence:
      enabled: ${RUNTIME_TRACE_PERSISTENCE:true}
      # A full multi-role review emits several thousand AG-UI events (observed 8200+ and still
      # growing); 1000 caused sustained RUNTIME_TRACE_PERSIST_BACKPRESSURE drops and incomplete
      # restart replay. Override with RUNTIME_TRACE_MAX_EVENTS if longer reviews hit the ceiling.
      max-events: ${RUNTIME_TRACE_MAX_EVENTS:20000}
  sse:
    # Transport controls only; event business sequence is always assigned by the event store.
    timeout: ${REVIEW_SSE_TIMEOUT:PT30M}
    heartbeat-interval: ${REVIEW_SSE_HEARTBEAT_INTERVAL:PT15S}
    replay-batch-size: ${REVIEW_SSE_REPLAY_BATCH_SIZE:500}
  notification:
    # Delivery is disabled until a verified Learning Platform MCP client and its real contract are supplied.
    worker-enabled: ${REVIEW_NOTIFICATION_WORKER_ENABLED:false}
    mcp-enabled: ${REVIEW_LEARNING_PLATFORM_MCP_ENABLED:false}
    # QQ/SMTP mail channel: set REVIEW_QQ_MAIL_ENABLED=true plus REVIEW_QQ_MAIL_SENDER and
    # REVIEW_QQ_MAIL_AUTH_CODE (QQ 邮箱授权码), then use channel smtp-mail with the recipient address as destination.
    mail-enabled: ${REVIEW_QQ_MAIL_ENABLED:false}
    channel: ${REVIEW_NOTIFICATION_CHANNEL:learning-platform}
    destination: ${REVIEW_NOTIFICATION_DESTINATION:learning-platform-recipient-placeholder}
    credential-environment-variable: ${REVIEW_LEARNING_PLATFORM_MCP_TOKEN_ENV:REVIEW_LEARNING_PLATFORM_MCP_TOKEN}
    max-attempts: ${REVIEW_NOTIFICATION_MAX_ATTEMPTS:5}
    initial-retry-delay: ${REVIEW_NOTIFICATION_INITIAL_RETRY_DELAY:PT30S}
    worker-delay: ${REVIEW_NOTIFICATION_WORKER_DELAY:PT5S}
    mail:
      host: ${REVIEW_QQ_MAIL_HOST:smtp.qq.com}
      port: ${REVIEW_QQ_MAIL_PORT:465}
      sender: ${REVIEW_QQ_MAIL_SENDER:}
      credential-environment-variable: ${REVIEW_QQ_MAIL_AUTH_CODE_ENV:REVIEW_QQ_MAIL_AUTH_CODE}
      subject-prefix: ${REVIEW_QQ_MAIL_SUBJECT_PREFIX:【重明需求评审】}
      auth-code: ${REVIEW_QQ_MAIL_AUTH_CODE:}
      # [AIREVIEW-PLAN-108] Externally visible base URL for the HTML report CTA; empty falls back to reportUrl.
      public-base-url: ${REVIEW_PUBLIC_BASE_URL:}
    chaoxing:
      # 学习通 uid 通知通道：默认关闭、继续以 QQ 邮箱为主；启用需配置 api/puid/pcode 与签名 token/key（fillParams_encnew），
      # 且收件人 users.company_uid 为数字 uid 时才会与邮件并行扇出（多端通知）。
      enabled: ${REVIEW_CHAOXING_ENABLED:false}
      api: ${REVIEW_CHAOXING_API:}
      detail-url: ${REVIEW_CHAOXING_DETAIL_URL:}
      puid: ${REVIEW_CHAOXING_PUID:}
      pcode: ${REVIEW_CHAOXING_PCODE:}
      token: ${REVIEW_CHAOXING_TOKEN:}
      key: ${REVIEW_CHAOXING_KEY:}
  auth:
    # 认证开关与 JWT 配置。签名密钥只允许通过环境变量 REVIEW_AUTH_JWT_SECRET 注入（HS256 至少 32 字节）；
    # 密钥缺失/过短且开关未显式置 true 时打 WARN 并自动禁用认证模块（正常启动），显式开启则拒绝启动；密钥不入库不入仓。
    enabled: ${REVIEW_AUTH_ENABLED:true}
    jwt-secret: ${REVIEW_AUTH_JWT_SECRET:}
    token-ttl: ${REVIEW_AUTH_TOKEN_TTL:PT12H}

logging:
  file:
    name: ${REVIEW_LOG_FILE:logs/chongming.log}
  logback:
    rollingpolicy:
      # Default 10MB was too small for long live-review debugging sessions; keep 20MB per file.
      max-file-size: ${REVIEW_LOG_MAX_FILE_SIZE:20MB}
      max-history: ${REVIEW_LOG_MAX_HISTORY:7}
  level:
    root: ${REVIEW_LOG_LEVEL:INFO}

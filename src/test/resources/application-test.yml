review:
  workspace-root: ${java.io.tmpdir}/chongming-test-workspace
  # [AIREVIEW-PLAN-024#方案1] Keep the test context on in-memory stores: the MyBatis
  # ReviewAssessmentStore lands with 方案5, so full-context tests must not require it.
  persistence:
    enabled: false
  max-agents: 8
  max-debate-rounds: 2
  agentscope:
    persist-session: false
    state-home: ${java.io.tmpdir}/chongming-test-state
  model-gateway:
    enabled: false
    model-name: test-model
    api-key: test-key

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

review:
  workspace-root: ${java.io.tmpdir}/chongming-test-workspace
  max-agents: 8
  max-debate-rounds: 2
  agentscope:
    persist-session: false
    state-home: ${java.io.tmpdir}/chongming-test-state
  model-gateway:
    enabled: false
    model-name: test-model
    api-key: test-key

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

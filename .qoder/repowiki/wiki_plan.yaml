version: 1

scope:
  include:
    - "src/main/java/**"
    - "src/test/java/**"
    - "frontend/src/**"
    - "docs/**"
    - "src/main/resources/**"
  exclude:
    - "target/**"
    - "frontend/node_modules/**"
    - "frontend/test-results/**"
    - ".agentscope/**"
    - ".idea/**"
    - "logs/**"
    - "output/**"
    - "src/main/resources/static/review/**"

repowiki:
  notes:
    - text: "Java 21 是强制要求，maven-enforcer-plugin 锁定 [21,22) 区间；不要将项目标记为兼容其他 Java 版本。"
      author: "knowledge-plan"
    - text: "Spring Boot 4.0.7 是父 POM；AgentScope Java 2.0.0 提供 Harness、OpenAI 扩展、MySQL 扩展和 AGUI 扩展。"
      author: "knowledge-plan"
    - text: "MySQL 5.6+ 是运行时数据库；Flyway 迁移故意避免 JSON 列，改用 LONGTEXT 以兼容 5.6。"
      author: "knowledge-plan"
    - text: "docs/技术方案/AI需求评审Agent_AgentScope2技术方案.md 是评审状态机的权威文档；docs/需求文档/ 是角色行为的权威文档。当其他文档冲突时，以技术方案为准。"
      author: "knowledge-plan"
    - text: "评审协议使用类型化领域对象（Claim、Debate、Judge、Gate），不是自由对话；ReviewProtocolGuard 在每个命令提交前校验状态、角色和动作合法性。"
      author: "knowledge-plan"
    - text: "角色配置定义在 src/main/resources/roles/*.yml，包含 product、project、frontend、backend、architecture、test、security、judge 共 8 个角色。"
      author: "knowledge-plan"
    - text: "src/main/resources/static/review/ 是前端构建产物的刻意提交点，不算生成产物；但 frontend/node_modules/ 和 target/ 是生成产物，不得纳入知识构建。"
      author: "knowledge-plan"
    - text: "每个新建 Java 源文件必须标注 @author wangli，并在适用时附带 [AIREVIEW-PLAN-xxx] 来源标记。"
      author: "knowledge-plan"
    - text: "密钥和网关凭据必须存放在环境变量或 application-local.yml 中，不得硬编码或提交到版本控制。"
      author: "knowledge-plan"
    - text: "docs/ 下有 24 个 AIREVIEW-PLAN-001~024 文档，分别跟踪各子系统的实现状态；不要将它们视为已完成的功能说明。"
      author: "knowledge-plan"
  documents:
    - title: "评审协议与状态机"
      goal: "说明 Review 聚合根的状态机、协议守卫、Claim/Debate/Judge/Gate 类型化领域对象，以及冲突检测机制。"
      parent: ""
      hints: "覆盖 domain/protocol/（ReviewStateMachine、DebateStateMachine、ReviewProtocolGuard、RequirementLifecycleStateMachine）；覆盖 domain/model/（Review、ReviewTypes、Claim、DebateTopic、GateDecision）；覆盖 domain/debate/ConflictDetector 和 domain/gate/GatePolicy；关联 docs/AIREVIEW-PLAN-003-领域契约状态机与协议守卫.md 和 docs/AIREVIEW-PLAN-009-对抗辩论Judge与Gate.md"
    - title: "多Agent Harness与角色编排"
      goal: "说明 AgentScope 运行时适配层如何将领域工具绑定到 Harness，以及 Director/角色/Judge 的编排与调度机制。"
      parent: ""
      hints: "覆盖 infrastructure/agentscope/ 全部（AgentScopeReviewRuntimeAdapter、ReviewWorkflowDispatcher、各 ToolFactory）；覆盖 infrastructure/agentscope/tool/ 下受限工具定义；覆盖 ReviewDirectorHarnessFactory、RoleSubagentFactory、ContextScoutHarnessFactory；关联 docs/AIREVIEW-PLAN-008-Harness主持人与角色编排.md 和 docs/AIREVIEW-PLAN-016-Harness上下文隔离与迭代收敛.md"
    - title: "模型网关与角色配置"
      goal: "说明 OpenAI 兼容模型网关的调用、流式、Tool Calls、重试策略，以及角色 profile 的注册与绑定。"
      parent: ""
      hints: "覆盖 domain/gateway/（ModelGateway、ModelProfile、ModelFailurePolicy、StructuredOutputs）；覆盖 infrastructure/model/（CommercialModelGateway、OpenAiCompatibleModelClient、ModelProfileRegistry）；覆盖 src/main/resources/roles/*.yml 角色定义；关联 docs/AIREVIEW-PLAN-007-模型网关与角色包.md"
    - title: "领域事件与SSE流"
      goal: "说明 ReviewEvent 全局序列、SSE 推送、历史重放、心跳与增量重连机制。"
      parent: ""
      hints: "覆盖 domain/event/（ReviewEvent、ReviewEventType、ReviewEventCategory、ReviewEventDraft）；覆盖 infrastructure/event/InMemoryReviewEventStore；覆盖 api/ReviewEventController 和 SSE 端点；关联 docs/AIREVIEW-PLAN-010-领域事件SSE与恢复.md"
    - title: "需求全生命周期管理"
      goal: "说明 Requirement 聚合根、生命周期状态机、CRUD 操作、看板投影以及评审启动流程。"
      parent: ""
      hints: "覆盖 domain/model/Requirement、domain/model/RequirementTypes；覆盖 domain/protocol/RequirementLifecycleStateMachine；覆盖 application/RequirementCommandService、RequirementLifecycleService、RequirementQueryService、RequirementReviewLaunchService；覆盖 api/RequirementCommandController、RequirementQueryController、DashboardController；关联 docs/AIREVIEW-PLAN-021-需求全生命周期管理平台.md"
    - title: "仓库快照与证据账本"
      goal: "说明本地仓库冻结快照、白名单控制、角色受限文件读取以及证据提交账本机制。"
      parent: ""
      hints: "覆盖 application/RepositorySnapshotService、EvidenceLedgerService；覆盖 infrastructure/agentscope/tool/ReadOnlyRepositoryTools、RepositoryFileGrant；覆盖 domain/model/RepositorySnapshot、SharedRepositorySnapshot、SnapshotReference、EvidenceBlock；关联 docs/AIREVIEW-PLAN-006-仓库快照与证据账本.md"
    - title: "前端评审工作台"
      goal: "说明 Vue 3/Vite 前端的页面结构、状态管理、SSE 适配、AG-UI 对话契约以及与后端的 API 契约。"
      parent: ""
      hints: "覆盖 frontend/src/views/（DashboardView、ReviewWorkbenchView、ReviewLiveView、ReviewReportView 等）；覆盖 frontend/src/stores/（review-store、runtime-trace-store）；覆盖 frontend/src/services/（review-sse、ag-ui-review-adapter、runtime-conversation-adapter 等）；关联 docs/AIREVIEW-PLAN-012-前端辩论工作台.md 和 docs/集成/AG-UI前端对话契约.md"
    - title: "MySQL持久化与数据迁移"
      goal: "说明 Flyway 迁移策略、MyBatis 仓储实现、领域投影监听器以及内存/MySQL 双写切换机制。"
      parent: ""
      hints: "覆盖 src/main/resources/db/migration/V1~V19 全部迁移脚本；覆盖 infrastructure/persistence/ 下 MyBatis 仓储实现；覆盖 infrastructure/persistence/MyBatisReviewStateProjectionListener；覆盖 domain/repository/ 下仓储接口定义；关联 docs/AIREVIEW-PLAN-004-MySQL持久化与数据迁移.md"
    - title: "人工审核与通知"
      goal: "说明 HUMAN_REQUIRED 状态下的人工 Gate 决策、审核项管理、报告生成以及通知发件箱机制。"
      parent: ""
      hints: "覆盖 application/HumanGateDecisionService、HumanReviewService、NotificationOutboxService；覆盖 domain/model/HumanGateDecision、HumanReviewItem、NotificationOutboxEntry；覆盖 infrastructure/notification/LearningPlatformMcpAdapter；覆盖 api/HumanGateDecisionController、HumanReviewController、NotificationOutboxController；关联 docs/AIREVIEW-PLAN-011-人工审核报告与通知.md 和 docs/集成/学习通通知MCP契约.md"
    - title: "ContextScout对话式工具流"
      goal: "说明 ContextScout 的对话式工具调用流、预览 SSE、结论存储与收敛机制。"
      parent: ""
      hints: "覆盖 application/ContextScoutPreviewService、ContextScoutConclusionService；覆盖 infrastructure/agentscope/ContextScoutHarnessFactory、ScoutToolTraceCollector；覆盖 domain/model/ContextScoutConclusion；覆盖 api/ContextScoutPreviewController；关联 docs/AIREVIEW-PLAN-019-ContextScout对话式工具流.md"
    - title: "工程基线与构建配置"
      goal: "说明 Maven 构建、enforcer 规则、JaCoCo 覆盖门禁、Spring Boot 打包以及前端构建集成。"
      parent: ""
      hints: "覆盖 pom.xml 的 enforcer、jacoco、spring-boot-maven-plugin 配置；覆盖 src/main/resources/application.yml 配置结构；覆盖 frontend/vite.config.js 和 frontend/package.json；关联 docs/AIREVIEW-PLAN-002-工程基线与AgentScope正式版验证.md"

knowledgecard:
  notes:
    - text: "生产 Java 代码位于 ai.cc.chongming.review 下，采用分层架构：api（REST 控制器）→ application（应用服务）→ domain（领域模型与协议）→ infrastructure（基础设施实现）。各层职责清晰，domain 层不依赖 infrastructure。"
      author: "knowledge-plan"
    - text: "infrastructure/agentscope/ 是 AgentScope 运行时适配层，将领域工具（DebateTools、EvidenceTools、ReadOnlyRepositoryTools）绑定到 AgentScope Harness；它是 domain 与 AgentScope 框架之间的桥梁。"
      author: "knowledge-plan"
    - text: "domain/repository/ 定义仓储接口，由 infrastructure/persistence/（MyBatis 实现）或 infrastructure/ 下的 InMemory* 实现提供双写支持；运行时可通过配置切换内存/MySQL 模式。"
      author: "knowledge-plan"
    - text: "frontend/ 是独立的 Vue 3/Vite 应用，通过 npm run build 构建到 src/main/resources/static/review/；前端通过 REST API 和 SSE 与后端通信，遵循 AG-UI 前端对话契约。"
      author: "knowledge-plan"
    - text: "docs/ 下 24 个 AIREVIEW-PLAN 文档按子系统拆分实现计划，每个文档带有明确的边界注释；不得将 PLAN 标记为已完成而缺乏可执行集成证据。"
      author: "knowledge-plan"
    - text: "角色编排模式：Director 规划 → 四核心角色（product/project/frontend/backend）提交 Claim → 冲突检测 → 约束辩论 → Judge 产出 Gate 草稿 → 人工最终决策；可选角色（architecture/test/security）在需要时激活。"
      author: "knowledge-plan"
